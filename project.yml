name: Chirp
options:
  bundleIdPrefix: dev.chirp
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: NO
packages:
  ChirpCore:
    path: Packages/ChirpCore
  ChirpEngines:
    path: Packages/ChirpEngines
targets:
  Chirp:
    type: application
    platform: macOS
    sources:
      - App
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    dependencies:
      - package: ChirpCore
      - package: ChirpEngines
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Chirp
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSMicrophoneUsageDescription: Chirp records your voice only while you hold the dictation key.
    entitlements:
      path: App/Chirp.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chirp.app
        PRODUCT_NAME: Chirp
